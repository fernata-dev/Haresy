[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bawwab"
version = "0.3.0"
description = "Bawwab (بوّاب; formerly Hares/Zorfa): discover, scan and opt-in protect AI agent setups (Claude Code, Gemini CLI) against prompt injection, plus the Hares research benchmark across Arabic dialects and encodings."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
tokenizer = ["tiktoken"]

[project.scripts]
bawwab = "bawwab.cli:main"
zorfa = "bawwab.cli:main"          # previous name, kept as an alias
hares = "hares.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hares = ["demo/static/*"]
bawwab = ["_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
