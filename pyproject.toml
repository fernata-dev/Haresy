[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zorfa"
version = "0.2.0"
description = "Zorfa (formerly Hares, حارس): discover, scan and opt-in protect AI agent setups (Claude Code, Gemini CLI) against prompt injection, plus the Hares research benchmark across Arabic dialects and encodings."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
tokenizer = ["tiktoken"]

[project.scripts]
zorfa = "zorfa.cli:main"
hares = "hares.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hares = ["demo/static/*"]
zorfa = ["_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
