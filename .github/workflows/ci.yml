name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags are needed for verify-freeze
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest
      - run: python -m hares validate
      - run: python -m hares verify-freeze
      - run: python -m hares verify-repro
      - run: python -m hares scan-skill fixtures/malicious_skill.md --fail-on high || test $? -eq 3
